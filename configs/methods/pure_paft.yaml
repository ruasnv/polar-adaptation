method:
  name: pure_paft
  freeze:
    Q_V: true          # frozen rotation — V projection (semi-orthogonal, from polar)
    Q_O: true          # frozen rotation — O projection (semi-orthogonal, from polar)
    EV_V: true         # frozen eigenvectors of S_V
    EV_O: true         # frozen eigenvectors of S_O
    W_Q: true
    W_K: true
    mlp: true
    layernorm_weight: true
    embeddings: true
    lm_head: true
    biases: true
  tune:
    lambda_V: true     # eigenvalues of S_V only — [n_heads, d_head] scalars
    lambda_O: true     # eigenvalues of S_O only — [n_heads, d_head] scalars
  # trainable params (GPT-2 small): 12 layers * 12 heads * 2 * 64 = 18,432
  # S is reconstructed as: EV @ diag(lambda) @ EV^T — rotation frozen, only magnitudes move