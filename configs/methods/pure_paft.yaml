method:
  name: pure_paft
  freeze:
    Q_V: true          # frozen rotation — V projection
    Q_O: true          # frozen rotation — O projection
    W_Q: true          # frozen Q projection
    W_K: true          # frozen K projection
    mlp: true
    layernorm_weight: true
    embeddings: true
    lm_head: true
    biases: true       # all biases frozen
  tune:
    S_V: true          # full [d_head, d_head] scaling matrix per head — OV circuit V side
    S_O: true          # full [d_head, d_head] scaling matrix per head — OV circuit O side
  constrain_S_symmetric: false
  rotation_drift_penalty: 0.0
  # trainable params (GPT-2 small): 12 layers * 12 heads * 2 * (64*64) = 1,179,648
