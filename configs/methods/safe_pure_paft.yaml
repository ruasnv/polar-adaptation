extends: pure_paft
method:
  name: safe_pure_paft
  freeze:
    Q_V: true
    Q_O: true
    EV_V: true
    EV_O: true
    W_Q: true
    W_K: true
    mlp: true
    layernorm_weight: true
    embeddings: true
    lm_head: true
  tune:
    lambda_V: true
    lambda_O: true
    biases: true       # all attention + MLP + layernorm biases — residual stream stabilization
  # trainable params (GPT-2 small): ~18K (lambda) + ~100K (biases) = ~120K