training:
  optimizer: adamw
  learning_rate: 2.0e-4
  weight_decay: 0.01
  # VRAM SAFETY: Reaching effective batch size 32 on an 8GB card
  micro_batch_size: 1
  gradient_accumulation_steps: 32
  max_seq_len: 512
  epochs: 5
  warmup_ratio: 0.06          # 6% of total steps
  lr_schedule: linear_decay   # linear decay after warmup
  gradient_clip: 1.0
  gradient_checkpointing: true # <--- Essential for GPT-2 Large
  eval_every_n_steps: 500
  save_every_epoch: true
  seed: 42

logging:
  log_every_n_steps: 10
  rotation_drift_every_n_steps: 100   # hybrid variants only
  eigenvalue_variance_every_n_steps: 100
  effective_rank_every_n_steps: 100