domain:
  name: biomedical
  shift: large
  tasks:
    question_answering:
      dataset: pubmed_qa
      dataset_config: pqa_labeled
      split_train: train
      split_val: train         # use 10% holdout from train
      split_test: test
      metrics: [accuracy]
      type: discriminative
      input_col: question
      target_col: final_decision
    summarization:
      dataset: bioasq          # abstract summarization subset
      split_train: train
      split_val: validation
      split_test: test
      metrics: [rouge1, rouge2, rougeL]
      type: generative
      input_col: body
      target_col: abstractText
