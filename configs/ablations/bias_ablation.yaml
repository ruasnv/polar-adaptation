# Sweeps over which bias terms to include — tests residual stream stabilization
ablation:
  name: bias_ablation
  base_method: pure_paft
  variants:
    - name: no_bias
      tune_biases: false
    - name: attn_bias_only
      tune_biases: [c_attn_bias, c_proj_bias]
    - name: mlp_bias_only
      tune_biases: [mlp_bias]
    - name: ln_bias_only
      tune_biases: [ln_bias]
    - name: all_bias
      tune_biases: true
  eval_domain: news       # run on one domain only
  eval_task: sentiment
  model: gpt2_small